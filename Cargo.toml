[workspace]
resolver = "2"
members = [
    "crates/gs-domain",
    "crates/gs",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Cerebral Engineering <engineering@cerebral.work>"]
repository = "https://github.com/unsigned-gg/gs"
publish = false

[profile.dev]
# Line tables give useful backtraces at a fraction of full DWARF compile time and disk size.
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
unnecessary_map_or = "warn"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

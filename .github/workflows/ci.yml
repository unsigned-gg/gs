name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Build & Verify (xwork + xtask)
    runs-on: {group: ent-default, labels: [ci-rust]}    # estate Rust toolchain runner (SOP: ci-runner-always-internal)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.94.1)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify estate hygiene & Wave-0 graph audit
        run: |
          cargo xtask hygiene
          cargo xtask graph-audit --break-check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -j 2 -- -D warnings

      - name: Run Tests
        run: |
          cargo test --workspace --locked -j 2
          cargo test --doc --workspace --locked -j 2

      # The EmbarkStudios action is a container action and needs a Docker
      # daemon, which estate runners do not have. Install the prebuilt binary
      # instead, as revenant does.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Supply-chain check (cargo-deny)
        run: cargo deny check licenses bans sources

  # LeanSpec PR gate (estate standard CER-2890; CER-2966). The lsc step is a
  # stub until vilicus ships the pinned lsc binary and its reusable job.
  # spec-link warns without failing until the history backfill is done.
  leanspec:
    name: leanspec
    if: github.event_name == 'pull_request'
    runs-on: {group: ent-default, labels: [self-hosted]}    # estate runner fleet (SOP: ci-runner-always-internal)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: lsc check (stub)
        run: echo "::notice title=lsc::lsc check specs/ is pending the pinned lsc binary and reusable job from vilicus"

      - name: spec-link (warning)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/ci/spec-link-check.sh "$PR_BASE"
